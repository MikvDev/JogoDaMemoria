<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/styles/game.css">
  <title>Jogo da Memória</title>
</head>

<body>

  <main>
    <header>
      <span class="player"></span>
      <div class="header-stats">
        <div class="stat-item">
          <span class="stat-label">⏱ Tempo</span>
          <span class="timer">0</span>s
        </div>
        <div class="stat-item">
          <span class="stat-label">🎯 Tentativas</span>
          <span class="attempts">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">🃏 Pares</span>
          <span class="pairs">0/10</span>
        </div>
        <div class="stat-item stat-item--score">
          <span class="stat-label">🏆 Pontos</span>
          <span class="score">0</span>
        </div>
      </div>
    </header>
    <div class="grid"></div>
  </main>

  <script src="/assets/js/game.js"></script>
</body>

</html>
